name: Check AWS Storage
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1
      - shell: bash
        run: |
          echo "=== S3 BUCKETS ==="
          aws s3 ls
          echo "=== EB ENVIRONMENTS ==="
          aws elasticbeanstalk describe-environments --environment-names Clickprestareapi-env --query 'Environments[*].[EnvironmentName,ApplicationName,Status,Health]' --output table
          APP_NAME="$(aws elasticbeanstalk describe-environments --environment-names Clickprestareapi-env --query 'Environments[0].ApplicationName' --output text)"
          echo "=== EB OPTION SETTINGS (ENVIRONMENT) ==="
          aws elasticbeanstalk describe-configuration-settings \
            --application-name "$APP_NAME" \
            --environment-name "Clickprestareapi-env" \
            --query "ConfigurationSettings[0].OptionSettings[?Namespace=='aws:elasticbeanstalk:application:environment'].OptionName" \
            --output table
