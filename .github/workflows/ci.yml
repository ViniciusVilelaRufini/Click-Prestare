name: CI

# Roda no push para as branches de deploy e em qualquer PR. O objetivo é
# simples: nada quebrado chega ao Railway (master) ou à Vercel (main) sem
# alguém ver antes.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Um push novo cancela a execução anterior da mesma branch — não adianta
# terminar de checar um commit que já foi substituído.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (typecheck, testes, build)
    runs-on: ubuntu-latest
    # A publicação no EB saiu deste job (ver `deploy`): ele roda em PR e não
    # deve ter credencial nenhuma.
    concurrency:
      group: ci-api-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: click-cond-web
    steps:
      - uses: actions/checkout@v4

      # 24.x é o que o package.json declara em `engines` e o que roda no
      # ambiente de desenvolvimento — o CI não pode divergir disso.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: click-cond-web/package-lock.json

      # `npm ci` roda o postinstall, que faz o `prisma generate` — sem o
      # client gerado, o typecheck acusa erro em todo acesso ao banco.
      - run: npm ci

      # Primeiro o typecheck: o build usa webpack e NÃO faz checagem estrita.
      # Foi ele que pegou o relatório de encomendas lendo campo inexistente e
      # a auditoria gravando ação inválida — dois bugs que o build aceitou.
      - name: Typecheck da API
        run: npx nx typecheck api

      - name: Testes da API
        run: npx nx test api

      - name: Build da API
        run: npx nx build api

      - name: Build da portaria-web
        run: npx nx build portaria-web

      # Deploy contínuo da API na AWS Elastic Beanstalk. Aqui só empacota (no
      # master: push ou disparo manual A PARTIR do master); quem publica é o
      # job `deploy`, o único com as credenciais da AWS. Antes, um
      # workflow_dispatch de QUALQUER branch publicava o código dela.
      - name: Empacotar API para Elastic Beanstalk
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: node scripts/migration/bundle-eb.mjs

      - name: Guardar pacote do Elastic Beanstalk
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-api-aws
          path: click-cond-web/deploy-api-aws.zip
          retention-days: 1

  deploy:
    name: Deploy no AWS Elastic Beanstalk
    needs: api
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Segredos da AWS ficam no environment `production` (regras de proteção e
    # branches permitidas configuradas no GitHub).
    environment: production
    permissions:
      id-token: write
      contents: read
    # Mesmo ambiente EB que o deploy-api.yml (push em main). Mesmo grupo =
    # fila: sem isso os dois colidiam e um falhava com "Environment ... Must
    # be Ready".
    concurrency:
      group: elastic-beanstalk-api-production
      cancel-in-progress: false
    env:
      AWS_REGION: sa-east-1
      ENVIRONMENT_NAME: Clickprestareapi-env
      VERSION_LABEL: "v-${{ github.run_number }}-${{ github.sha }}"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deploy-api-aws

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::850401152034:role/github-deploy-prestare
          role-session-name: prestare-deploy-ci
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy no AWS Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ env.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ env.AWS_SESSION_TOKEN }}
          application_name: click-prestare-api
          environment_name: ${{ env.ENVIRONMENT_NAME }}
          version_label: ${{ env.VERSION_LABEL }}
          region: ${{ env.AWS_REGION }}
          deployment_package: deploy-api-aws.zip
          use_existing_version_if_available: true
          wait_for_deployment: true
          wait_for_environment_recovery: 180

      # Mesma conferência do deploy-api.yml: update-environment que falha
      # (ex.: env acima de 4096 chars) deixa o ambiente "Ready" na versão
      # antiga e o deploy volta verde.
      - name: Verify deployed version
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(aws elasticbeanstalk describe-environments \
            --environment-names "$ENVIRONMENT_NAME" \
            --query 'Environments[0].VersionLabel' --output text)"
          echo "Versão esperada: $VERSION_LABEL"
          echo "Versão no ambiente: $ACTUAL"
          if [ "$ACTUAL" != "$VERSION_LABEL" ]; then
            echo "::error::O ambiente não está na versão implantada. Últimos eventos:"
            aws elasticbeanstalk describe-events \
              --environment-name "$ENVIRONMENT_NAME" --max-items 15 \
              --query 'Events[].[EventDate,Severity,Message]' --output text
            exit 1
          fi

  audit:
    name: Auditoria de dependências (npm audit)
    runs-on: ubuntu-latest
    # Informativo: não bloqueia o CI. Vulnerabilidades altas aparecem no resumo
    # da execução e o Dependabot abre os PRs de correção.
    continue-on-error: true
    defaults:
      run:
        working-directory: click-cond-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: click-cond-web/package-lock.json

      - run: npm ci --ignore-scripts

      - name: Resumo da auditoria
        run: |
          npm audit --json > audit.json || true
          node -e "
          const a = JSON.parse(require('fs').readFileSync('audit.json', 'utf8'));
          const v = (a.metadata && a.metadata.vulnerabilities) || {};
          const rows = ['critical','high','moderate','low','info'].map(k => '| ' + k + ' | ' + (v[k] || 0) + ' |');
          const out = ['## npm audit (click-cond-web)', '', '| Severidade | Qtde |', '|---|---|', ...rows, ''].join(String.fromCharCode(10));
          require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, out);
          "

      - name: npm audit (nível high)
        run: npm audit --audit-level=high

  app:
    name: App Flutter (analyze e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: click-cond-app/click-cond-app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - run: flutter pub get

      # O gate é ERRO. Hoje o app tem 0 erros e 39 warnings pré-existentes
      # (import não usado, campo não lido) mais centenas de infos de
      # deprecação — nada disso é regressão, e fazer o CI nascer vermelho só
      # ensina a ignorá-lo.
      #
      # Quando os 39 warnings forem limpos, tirar `--no-fatal-warnings` para
      # apertar o gate. O mesmo caminho foi feito no typecheck da API: os 59
      # erros foram zerados antes de torná-lo bloqueante.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testes
        run: flutter test
