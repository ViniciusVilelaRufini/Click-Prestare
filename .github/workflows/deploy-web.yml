name: Deploy web to Amplify

on:
  push:
    branches: [main]
    paths:
      - 'click-cond-web/apps/portaria-web/**'
      - 'amplify.yml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Publish portaria-web
    runs-on: ubuntu-latest
    env:
      AWS_REGION: sa-east-1
      AMPLIFY_APP_ID: d340ziyanv9pav
      AMPLIFY_BRANCH: main

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start and verify Amplify release
        shell: bash
        run: |
          set -euo pipefail
          JOB_ID="$(aws amplify start-job \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --job-type RELEASE \
            --query 'jobSummary.jobId' --output text)"
          echo "Amplify job: $JOB_ID"

          for _ in $(seq 1 60); do
            STATUS="$(aws amplify get-job \
              --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$AMPLIFY_BRANCH" \
              --job-id "$JOB_ID" \
              --query 'job.summary.status' --output text)"
            echo "Amplify status: $STATUS"
            case "$STATUS" in
              SUCCEED) exit 0 ;;
              FAILED|CANCELLED) exit 1 ;;
            esac
            sleep 15
          done

          echo 'Amplify build timed out.' >&2
          exit 1
