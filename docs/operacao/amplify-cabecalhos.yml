# Cabeçalhos do app Amplify d340ziyanv9pav (aws amplify update-app --custom-headers).
# Estado DESEJADO (rodada SEO 09/11/2026). Aplicar junto com amplify-regras.json e
# conferir com curl -I depois de publicar (ver o checklist no fim do arquivo).
#
# CSP só em Report-Only por enquanto. A /sobre/ não usa mais React/Babel do
# unpkg nem eval; os scripts de terceiros que sobram são as tags de anúncio,
# carregadas só com consentimento (consentimento-anuncios.js).
customHeaders:
  - pattern: '**/*'
    headers:
      # includeSubDomains vale para todo *.prestarecondominios.com.br: antes de
      # aplicar, confirmar que nenhum subdomínio é servido só em HTTP (www e
      # api já respondem em HTTPS). Sem "preload" de propósito: sair da lista
      # de preload dos navegadores é demorado.
      - key: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: SAMEORIGIN
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=(), payment=()
      # Report-Only sem 'unsafe-eval': nem a landing (pagina.js, sem Babel) nem o
      # console Angular (AOT) usam eval, então qualquer relato aqui é sinal de
      # problema. Antes de trocar para Content-Security-Policy (aplicada), ver a
      # proposta "CSP aplicada" no fim do arquivo.
      - key: Content-Security-Policy-Report-Only
        value: "default-src 'self' https: data: blob: 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"

  # ---- Texto e XML com charset: llms.txt e robots.txt têm acentos ----
  - pattern: '*.txt'
    headers:
      - key: Content-Type
        value: text/plain; charset=utf-8
  - pattern: '/sitemap.xml'
    headers:
      - key: Content-Type
        value: application/xml; charset=utf-8

  # ---- Cache longo e imutável: só arquivos cujo nome muda quando o conteúdo muda ----
  # Pacotes do Angular gerados com outputHashing "all" (main-HASH.js, chunk-HASH.js...).
  - pattern: '/main-*.js'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: '/chunk-*.js'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: '/polyfills-*.js'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: '/styles-*.css'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: '/media/**'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  # Fontes do próprio site: se um dia trocar o arquivo, trocar também o nome.
  - pattern: '/fontes/*.woff2'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  # Imagem com versão no nome. Padrão explícito (sem classe [0-9] de glob, que
  # não está documentada nos cabeçalhos do Amplify). Ao criar uma -v4, somar aqui.
  - pattern: '/sobre/assets/og-prestare-gestao-v3.jpg'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  # Demais imagens das páginas (telas, OGs por página, foto do escritório,
  # selos): os nomes ainda não levam versão, então o cache é de 1 dia com
  # revalidação, para uma troca de imagem aparecer no dia seguinte.
  - pattern: '/sobre/assets/*.webp'
    headers:
      - key: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
  - pattern: '/sobre/assets/*.jpg'
    headers:
      - key: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
  - pattern: '/sobre/assets/*.png'
    headers:
      - key: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
  - pattern: '/sobre/assets/*.svg'
    headers:
      - key: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
  - pattern: '/*.svg'
    headers:
      - key: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
  - pattern: '/favicon*'
    headers:
      - key: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800

  # ---- Fora da busca: console (SPA) e raiz ----
  # A raiz é o login/convite/redefinição de senha por query; as rotas abaixo são
  # as de src/app/app.routes.ts. noindex com follow: os links continuam valendo.
  - pattern: '/'
    headers:
      - key: X-Robots-Tag
        value: noindex, follow
  - pattern: '/index.html'
    headers:
      - key: X-Robots-Tag
        value: noindex, follow
  - pattern: '/404.html'
    headers:
      - key: X-Robots-Tag
        value: noindex, follow
  - pattern: '/login'
    headers:
      - key: X-Robots-Tag
        value: noindex, follow
  - pattern: '/redefinir-senha'
    headers:
      - key: X-Robots-Tag
        value: noindex
  - pattern: '/selecionar-condominio'
    headers:
      - key: X-Robots-Tag
        value: noindex
  - pattern: '/convite'
    headers:
      - key: X-Robots-Tag
        value: noindex
  - pattern: '/convite/*'
    headers:
      - key: X-Robots-Tag
        value: noindex
  # Aliases do SPA para as páginas legais: a versão indexável é a .html estática.
  - pattern: '/politica-de-privacidade'
    headers:
      - key: X-Robots-Tag
        value: noindex, follow
  - pattern: '/politica-privacidade'
    headers:
      - key: X-Robots-Tag
        value: noindex, follow
  - pattern: '/exclusao-de-conta'
    headers:
      - key: X-Robots-Tag
        value: noindex, follow
  - pattern: '/exclusao-conta'
    headers:
      - key: X-Robots-Tag
        value: noindex, follow
  - pattern: '/dashboard'
    headers:
      - key: X-Robots-Tag
        value: noindex
  - pattern: '/visitantes'
    headers:
      - key: X-Robots-Tag
        value: noindex
  - pattern: '/prestadores'
    headers:
      - key: X-Robots-Tag
        value: noindex
  - pattern: '/prestadores/cadastro'
    headers:
      - key: X-Robots-Tag
        value: noindex
  - pattern: '/moradores'
    headers:
      - key: X-Robots-Tag
        value: noindex
  - pattern: '/apartamentos'
    headers:
      - key: X-Robots-Tag
        value: noindex
  - pattern: '/veiculos'
    headers:
      - key: X-Robots-Tag
        value: noindex
  - pattern: '/ocorrencias'
    headers:
      - key: X-Robots-Tag
        value: noindex
  - pattern: '/comunicados'
    headers:
      - key: X-Robots-Tag
        value: noindex
  - pattern: '/encomendas'
    headers:
      - key: X-Robots-Tag
        value: noindex
  - pattern: '/delivery'
    headers:
      - key: X-Robots-Tag
        value: noindex
  - pattern: '/areas-sociais'
    headers:
      - key: X-Robots-Tag
        value: noindex
  - pattern: '/assembleias'
    headers:
      - key: X-Robots-Tag
        value: noindex
  - pattern: '/financeiro'
    headers:
      - key: X-Robots-Tag
        value: noindex
  - pattern: '/documentos'
    headers:
      - key: X-Robots-Tag
        value: noindex
  - pattern: '/configuracoes'
    headers:
      - key: X-Robots-Tag
        value: noindex
  - pattern: '/terminais-faciais'
    headers:
      - key: X-Robots-Tag
        value: noindex
  - pattern: '/relatorios'
    headers:
      - key: X-Robots-Tag
        value: noindex

# ---------------------------------------------------------------------------
# Checklist depois de aplicar (curl -sI, sempre com o www salvo indicação):
#   https://prestarecondominios.com.br/sobre/?x=1  -> 301 para https://www.../sobre/?x=1
#   /sobre e /precos (sem barra)                   -> 301 para a versão com barra
#   /sobre/, /precos/, /sindico/ e as outras 4     -> 200, sem X-Robots-Tag
#   /, /login, /dashboard, /convite/abc            -> 200 com X-Robots-Tag noindex
#   /?convite=abc e /?token=abc                     -> 200 (o SPA abre convite e redefinição)
#   /dashboard/abc, /login/x                       -> 404 (antes era 200 com o shell)
#   /chunk-*.js e /fontes/barlow-400.woff2         -> Cache-Control immutable
#   /politica-de-privacidade, /termos-de-uso,
#   /exclusao-de-conta (e os aliases antigos)      -> 301 para a versão .html
#     (o componente Angular dessas rotas já fazia location.replace para a .html;
#      a âncora, como #biometria, é mantida pelo navegador no 301)
#
# 404 com corpo (NÃO aplicado): a regra catch-all "/<*> -> /404.html, status 404"
# já gerou 301/302 para uma página 200 neste app e foi retirada. O arquivo
# public/404.html existe (noindex) para quando houver forma segura. Proposta de
# teste, só num branch de pré-visualização do Amplify, nunca direto no master:
#   1. Acrescentar como ÚLTIMA regra: {"source": "/<*>", "target": "/404.html", "status": "404"}
#      ("404" devolve o corpo do alvo com status 404; "404-200" devolveria 200,
#      que seria soft-404) e conferir com curl -sI que /nao-existe responde 404
#      (não 200, 301 ou 302), que /sobre (sem barra) ainda dá 301 e que /sobre/,
#      /login, /?convite=x e /api/... seguem como antes.
#   2. Se o Amplify responder 200 ou redirecionar, desistir e manter o 404 vazio
#      atual (status correto, só sem corpo).
# Janela do deploy: o HTML do console em cache pode apontar para main-*.js de um
# build já apagado (visto em 09/11). O HTML segue com max-age=0 (padrão) e os
# bundles com hash ficam imutáveis; se voltar a acontecer, invalidar "/" e
# "/index.html" no fim do deploy.
#
# Scripts da landing sem hash (/sobre/pagina.js, /consentimento-anuncios.js,
# /paginas.css) ficam com o padrão max-age=0: são minificados no build
# (click-cond-web/scripts/minificar-landing.mjs) e revalidados a cada visita.
#
# Não foi incluído 301 de /pagina/index.html para /pagina/: a regra 200 de
# /pagina/ reescreve justamente para /pagina/index.html; a canônica cobre o caso.
#
# Conferências a mais (curl -sI):
#   /llms.txt e /robots.txt   -> Content-Type: text/plain; charset=utf-8
#   /sitemap.xml              -> Content-Type: application/xml; charset=utf-8
#   /sobre/assets/og-precos.jpg -> Cache-Control max-age=86400 (não immutable)
#   http://prestarecondominios.com.br/ -> hoje são 2 saltos (o CloudFront do
#     Amplify sobe para https no mesmo host e a 1ª regra leva ao www). Um salto
#     só exigiria a função de borda fora do Amplify; 2 saltos 301 são aceitáveis.
#
# HSTS e includeSubDomains: o cabeçalho enviado pelo www só cobre *.www. Para
# valer em api., crm. etc., ele precisa sair também da raiz sem www
# (prestarecondominios.com.br). Conferir se a resposta 301 da 1ª regra leva o
# Strict-Transport-Security; se não levar, o includeSubDomains fica restrito ao www.
#
# CSP aplicada (proposta, NÃO aplicar sem uma semana de Report-Only limpo no
# console do navegador e sem testar o consentimento e as tags de conversão):
#   pattern '/sobre/*', '/sindico/*', '/precos/*', '/quem-somos/*' e as três
#   páginas de funcionalidade, com:
#   default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com
#   https://bzrcdn.openai.com; connect-src 'self' https://api.prestarecondominios.com.br
#   https://*.google.com https://*.google-analytics.com https://*.doubleclick.net
#   https://*.openai.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline';
#   font-src 'self'; frame-src https://*.doubleclick.net https://www.googletagmanager.com;
#   object-src 'none'; base-uri 'self'; frame-ancestors 'self'
#   ('unsafe-inline' em script-src continua porque o registro do lead e a troca
#   de tema são scripts inline; trocar por hashes quando o build gerar esses
#   blocos. O JSON-LD não conta: tipo application/ld+json não executa.)
