# ---------------------------------------------------------------------------
# Checklist depois de aplicar (curl -sI, sempre com o www salvo indicação):
#   https://prestarecondominios.com.br/sobre/?x=1  -> 301 para https://www.../sobre/?x=1
#   /sobre e /precos (sem barra)                   -> 301 para a versão com barra
#   /sobre/, /precos/, /sindico/ e as outras 4     -> 200, sem X-Robots-Tag
#   /, /login, /dashboard, /convite/abc            -> 200 com X-Robots-Tag noindex
#   /?convite=abc e /?token=abc                     -> 200 (o SPA abre convite e redefinição)
#   /dashboard/abc, /login/x                       -> 404 (antes era 200 com o shell)
#   /chunk-*.js e /fontes/barlow-400.woff2         -> Cache-Control immutable
#
# 404 com corpo (NÃO aplicado): a regra catch-all "/<*> -> /404.html, status 404"
# já gerou 301/302 para uma página 200 neste app e foi retirada. O arquivo
# public/404.html existe (noindex) para quando houver forma segura. Proposta de
# teste, só num branch de pré-visualização do Amplify, nunca direto no master:
#   1. Acrescentar como ÚLTIMA regra: {"source": "/<*>", "target": "/404.html", "status": "404"}
#      ("404" devolve o corpo do alvo com status 404; "404-200" devolveria 200,
#      que seria soft-404) e conferir com curl -sI que /nao-existe responde 404
#      (não 200, 301 ou 302), que /sobre (sem barra) ainda dá 301 e que /sobre/,
#      /login, /?convite=x e /api/... seguem como antes.
#   2. Se o Amplify responder 200 ou redirecionar, desistir e manter o 404 vazio
#      atual (status correto, só sem corpo).
# Não foi incluído 301 de /pagina/index.html para /pagina/: a regra 200 de
# /pagina/ reescreve justamente para /pagina/index.html; a canônica cobre o caso.
