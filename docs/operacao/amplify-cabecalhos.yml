# Cabeçalhos do app Amplify d340ziyanv9pav (aws amplify update-app --custom-headers).
# CSP só em Report-Only por enquanto: a landing usa scripts inline e de terceiros; endurecer depois de observar.
customHeaders:
  - pattern: '**/*'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: SAMEORIGIN
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=(), payment=()
      - key: Content-Security-Policy-Report-Only
        value: "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"
