version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22 || nvm use 22 || nvm use 20
        - node -v
        - cd click-cond-web
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: click-cond-web/dist/apps/portaria-web/browser
    files:
      - '**/*'
  cache:
    paths:
      - click-cond-web/node_modules/**/*
