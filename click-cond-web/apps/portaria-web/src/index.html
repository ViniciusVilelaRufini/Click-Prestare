<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Click Portaria - Web Console</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      (function() {
        var hour = new Date().getHours();
        var currentPhase = (hour >= 18 || hour < 5) ? 'night' : 'day';
        var savedPhase = localStorage.getItem('theme_phase');
        var savedMode = localStorage.getItem('theme_mode');

        var isLight = false;
        if (savedPhase !== currentPhase) {
          isLight = currentPhase === 'day';
          localStorage.setItem('theme_phase', currentPhase);
          localStorage.setItem('theme_mode', isLight ? 'light' : 'dark');
        } else if (savedMode) {
          isLight = savedMode === 'light';
        } else {
          isLight = currentPhase === 'day';
          localStorage.setItem('theme_phase', currentPhase);
          localStorage.setItem('theme_mode', isLight ? 'light' : 'dark');
        }

        if (isLight) {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
          window.addEventListener('DOMContentLoaded', function() {
            document.body.classList.add('light');
            document.body.classList.remove('dark');
          });
        } else {
          document.documentElement.classList.remove('light');
          document.documentElement.classList.add('dark');
          window.addEventListener('DOMContentLoaded', function() {
            document.body.classList.remove('light');
            document.body.classList.add('dark');
          });
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
