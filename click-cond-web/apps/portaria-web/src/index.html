<!doctype html>
<html lang="en">
  <head>
    <script>/* /sindico/ é uma página estática; sem regra de reescrita no Amplify o SPA responderia no lugar dela */if(/^\/sindico\/?$/.test(location.pathname)){location.replace("/sindico/index.html"+location.search+location.hash);}</script>
    <script>/* domínio antigo -> domínio principal */if(/(^|.)clickprestarecondominios.com.br$/.test(location.hostname)){location.replace("https://www.prestarecondominios.com.br"+location.pathname+location.search+location.hash);}</script>
    <meta charset="utf-8" />
    <title>Prestare Gestão — Console da portaria</title>
    <meta name="description" content="Controle de acesso para condomínios: controle de visitantes, encomendas, reconhecimento facial, portaria digital e app para síndico e moradores. Peça um orçamento." />
    <!-- A apresentação pública é /sobre/; o console (login e painel) não é a página de entrada da busca. -->
    <link rel="canonical" href="https://www.prestarecondominios.com.br/sobre/" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script>
      /* Mesma regra do ThemeService: a escolha salva vence; sem ela, segue o sistema, e o escuro é o padrão. */
      (function() {
        var salvo = localStorage.getItem('prestare_theme');
        var claro = salvo === 'light' || (salvo !== 'dark' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
        var tema = claro ? 'light' : 'dark';
        var oposto = claro ? 'dark' : 'light';
        document.documentElement.classList.add(tema);
        document.documentElement.classList.remove(oposto);
        window.addEventListener('DOMContentLoaded', function() {
          document.body.classList.add(tema);
          document.body.classList.remove(oposto);
        });
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
