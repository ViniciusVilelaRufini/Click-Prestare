<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Console da portaria | Prestare Gestão</title>
    <meta name="description" content="Entrada do console da portaria e da administração do Prestare Gestão. Para conhecer o sistema de controle de acesso para condomínios, veja a página de apresentação." />
    <!-- O console (login, painel, convite e redefinição de senha pela raiz) não
         é página de busca: noindex, mas os links seguem valendo. A apresentação
         pública é /sobre/; a raiz não aponta canônica para ela porque o
         conteúdo é outro. -->
    <meta name="robots" content="noindex, follow" />
    <!-- Mesmo nó WebSite das páginas públicas (@id #site), com url na raiz do domínio. -->
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","@id":"https://www.prestarecondominios.com.br/#site","url":"https://www.prestarecondominios.com.br/","name":"Prestare Gestão","inLanguage":"pt-BR","publisher":{"@type":"Organization","@id":"https://www.prestarecondominios.com.br/#org","name":"Prestare Gestão","url":"https://www.prestarecondominios.com.br/sobre/","logo":"https://www.prestarecondominios.com.br/logo-prestare-gestao.png"}}</script>
    <script>/* domínio antigo -> domínio principal (a borda já faz 301; isto cobre um host que escape dela) */if(/(^|.)clickprestarecondominios.com.br$/.test(location.hostname)){location.replace("https://www.prestarecondominios.com.br"+location.pathname+location.search+location.hash);}</script>
    <script>/* /sindico/ é uma página estática; sem regra de reescrita no Amplify o SPA responderia no lugar dela */if(/^\/sindico\/?$/.test(location.pathname)){location.replace("/sindico/index.html"+location.search+location.hash);}</script>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script>
      /* Mesma regra do ThemeService: a escolha salva vence; sem ela, segue o sistema, e o escuro é o padrão. */
      (function() {
        var salvo = localStorage.getItem('prestare_theme');
        var claro = salvo === 'light' || (salvo !== 'dark' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
        var tema = claro ? 'light' : 'dark';
        var oposto = claro ? 'dark' : 'light';
        document.documentElement.classList.add(tema);
        document.documentElement.classList.remove(oposto);
        window.addEventListener('DOMContentLoaded', function() {
          document.body.classList.add(tema);
          document.body.classList.remove(oposto);
        });
      })();
    </script>
    <style>
      /* Conteúdo inicial: aparece só enquanto o console carrega (o Angular
         substitui o que está dentro de app-root) e para quem não roda JS. */
      .ps-inicial{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;box-sizing:border-box;text-align:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#000;color:#f2f2f2}
      html.light .ps-inicial{background:#fff;color:#111}
      .ps-inicial h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.02em}
      .ps-inicial p{margin:0;font-size:15px;line-height:1.5;opacity:.75}
      .ps-inicial a{color:inherit;text-decoration:underline;text-underline-offset:3px}
    </style>
  </head>
  <body>
    <app-root>
      <main class="ps-inicial">
        <h1>Prestare Gestão: console da portaria</h1>
        <p>Carregando o console. <a href="/sobre/">Conheça o sistema de controle de acesso para condomínios</a></p>
      </main>
    </app-root>
  </body>
</html>
