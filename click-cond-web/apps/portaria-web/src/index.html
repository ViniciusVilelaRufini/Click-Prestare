<!doctype html>
<html lang="en">
  <head>
    <script>/* /sindico/ é uma página estática; sem regra de reescrita no Amplify o SPA responderia no lugar dela */if(/^\/sindico\/?$/.test(location.pathname)){location.replace("/sindico/index.html"+location.search+location.hash);}</script>
    <script>/* domínio antigo -> domínio principal */if(/(^|.)clickprestarecondominios.com.br$/.test(location.hostname)){location.replace("https://www.prestarecondominios.com.br"+location.pathname+location.search+location.hash);}</script>
    <meta charset="utf-8" />
    <title>Prestare Gestão — Console da portaria</title>
    <meta name="description" content="Controle de acesso para condomínios: reconhecimento facial, portaria digital e remota, visitantes, encomendas e app do morador. Peça um orçamento." />
    <!-- A apresentação pública é /sobre/; o console (login e painel) não é a página de entrada da busca. -->
    <link rel="canonical" href="https://www.prestarecondominios.com.br/sobre/" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script>
      (function() {
        var hour = new Date().getHours();
        var currentPhase = (hour >= 18 || hour < 5) ? 'night' : 'day';
        var savedPhase = localStorage.getItem('theme_phase');
        var savedMode = localStorage.getItem('theme_mode');

        var isLight = false;
        if (savedPhase !== currentPhase) {
          isLight = currentPhase === 'day';
          localStorage.setItem('theme_phase', currentPhase);
          localStorage.setItem('theme_mode', isLight ? 'light' : 'dark');
        } else if (savedMode) {
          isLight = savedMode === 'light';
        } else {
          isLight = currentPhase === 'day';
          localStorage.setItem('theme_phase', currentPhase);
          localStorage.setItem('theme_mode', isLight ? 'light' : 'dark');
        }

        if (isLight) {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
          window.addEventListener('DOMContentLoaded', function() {
            document.body.classList.add('light');
            document.body.classList.remove('dark');
          });
        } else {
          document.documentElement.classList.remove('light');
          document.documentElement.classList.add('dark');
          window.addEventListener('DOMContentLoaded', function() {
            document.body.classList.remove('light');
            document.body.classList.add('dark');
          });
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
