# Sem este arquivo, o nginx do Elastic Beanstalk usa o default de compilacao
# (1m) para client_max_body_size, e rejeita com 413 QUALQUER requisicao maior
# que isso ANTES dela chegar no NestJS — mesmo o app aceitando ate 50mb
# (json({limit:'50mb'}) em main.ts). Toda tela que envia foto em base64
# (condominio, area social, visitante, morador, etc) esbarrava nisso assim
# que a foto passava de ~1MB, o que e trivial com camera moderna mesmo a
# imageQuality:50 (o picker do app nao limita resolucao, so qualidade JPEG).
#
# No Railway isso nunca deu problema porque o proxy de borda de la nao impoe
# esse teto por padrao. A migracao para o Elastic Beanstalk (nginx) expos o
# limite sem que ninguem precisasse configura-lo explicitamente ate agora.
#
# O Elastic Beanstalk inclui automaticamente todo .conf deste diretorio
# dentro do bloco http{} do nginx gerado no deploy — nao precisa de reinicio
# manual nem de SSH na instancia.
client_max_body_size 50M;
