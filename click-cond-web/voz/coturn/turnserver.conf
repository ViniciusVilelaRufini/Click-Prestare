# Prestare Voz — coturn (TURN para redes que bloqueiam UDP direto).
# Credencial REST: username "<exp>:<uid>", senha = base64(HMAC-SHA1(segredo, username)),
# emitida pela API (VOZ_TURN_SECRET). Segredo e IP privado preenchidos pelo instalar.sh.
listening-port=3478
listening-ip=__IP_PRIVADO__
relay-ip=__IP_PRIVADO__
external-ip=54.21.36.213/__IP_PRIVADO__
min-port=50000
max-port=50999
realm=voz.prestarecondominios.com.br
use-auth-secret
static-auth-secret=__VOZ_TURN_SECRET__
fingerprint
no-cli
no-tls
no-dtls
no-multicast-peers
stale-nonce=600
user-quota=12
total-quota=1200
# Não deixa o TURN virar ponte para a rede interna da AWS; a própria máquina
# (Asterisk) continua alcançável pelo IP privado.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
allowed-peer-ip=__IP_PRIVADO__
syslog
simple-log
