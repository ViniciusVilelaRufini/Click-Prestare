; Prestare Voz — PJSIP. Faciais e monitores (contas fac<id>/mon<id>) vêm de
; pjsip_prestare.conf, gerado pelo serviço a partir da API. App e console nunca
; ficam registrados: entram como "anonymous" por WebRTC discando
; sip:entrar@voz.prestarecondominios.com.br com o cabeçalho X-Prestare-Token.

[global]
type=global
user_agent=Prestare Voz
endpoint_identifier_order=ip,username,anonymous

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=172.31.0.0/16
external_media_address=54.21.36.213
external_signaling_address=54.21.36.213

; Faciais e monitores registram na 5080 (contas fixadas neste transporte em
; pjsip_prestare.conf). Motivo: o "SIP ALG" de muitos roteadores reescreve o
; que passa pela 5060 e engole as respostas da central; e, atras de NAT, o que
; a central envia ao aparelho (OPTIONS, INFO de abrir, BYE) precisa sair da
; mesma porta em que ele registrou.
[transport-udp-5080]
type=transport
protocol=udp
bind=0.0.0.0:5080
local_net=172.31.0.0/16
external_media_address=54.21.36.213
external_signaling_address=54.21.36.213

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
local_net=172.31.0.0/16
external_media_address=54.21.36.213
external_signaling_address=54.21.36.213

; WSS do WebRTC: o nginx termina o TLS na 8089 e repassa /ws ao HTTP do
; Asterisk em 127.0.0.1:8088 (http.conf).
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0
local_net=172.31.0.0/16
external_media_address=54.21.36.213
external_signaling_address=54.21.36.213

; Quem não é facial/monitor conhecido cai aqui e só alcança o contexto
; prestare-entrar, que exige um token de voz válido emitido pela API.
[anonymous]
type=endpoint
context=prestare-entrar
transport=transport-wss
webrtc=yes
disallow=all
allow=ulaw,alaw,h264
max_audio_streams=1
max_video_streams=1
direct_media=no

#include pjsip_prestare.conf
