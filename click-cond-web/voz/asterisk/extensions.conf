; Prestare Voz — plano de discagem. Nenhum contexto liga para fora (não há
; tronco): tudo vai para o Stasis "prestare" (serviço Node) ou desliga.

[general]
static=yes
writeprotect=yes
clearglobalvars=no

[globals]

; Facial registrado (endpoint fac<id>) discou o ramal da unidade.
[prestare-facial]
exten => _X!,1,Stasis(prestare,facial,${CHANNEL(endpoint)},${EXTEN})
 same => n,Hangup()

; App/console por WebRTC: só a extensão "entrar", com o token no cabeçalho.
[prestare-entrar]
exten => entrar,1,Stasis(prestare,entrar,${PJSIP_HEADER(read,X-Prestare-Token)})
 same => n,Hangup()

; Monitor IP só recebe chamadas da central; nada que ele disque vai a lugar algum.
[prestare-monitor]
exten => _X!,1,Hangup()

; --- Testes sem facial (deploy/simular-facial.sh) -------------------------
; Só é alcançado por canal Local originado na própria máquina. A conta do
; facial simulado vem da variável global PRESTARE_CONTA_TESTE.
[prestare-facial-teste]
exten => _X!,1,NoOp(Facial simulado ${GLOBAL(PRESTARE_CONTA_TESTE)} discando ${EXTEN})
 same => n,Stasis(prestare,facial,${GLOBAL(PRESTARE_CONTA_TESTE)},${EXTEN})
 same => n,Hangup()

; Lado "visitante" do canal Local: depois de atendido, fala sem parar
; (áudio de teste) até alguém desligar.
[prestare-visitante-teste]
exten => s,1,Answer()
 same => n(fala),Playback(tt-monkeys)
 same => n,GotoIf($["${PLAYBACKSTATUS}" = "SUCCESS"]?fala)
 same => n,Wait(170)
 same => n,Hangup()
