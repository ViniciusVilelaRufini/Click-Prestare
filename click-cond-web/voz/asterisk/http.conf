; Prestare Voz — servidor HTTP do Asterisk.
; ARI em texto puro só no loopback (127.0.0.1:8088), usado pelo serviço Node.
; TLS público em 8089 para o WSS do WebRTC (/ws). Atenção: o Asterisk serve a
; ARI em todos os listeners, então ela também responde em 8089 — protegida
; pela senha longa do usuário "prestare" (ari.conf) e pelo fail2ban.
[general]
enabled=yes
bindaddr=127.0.0.1
bindport=8088
tlsenable=yes
tlsbindaddr=0.0.0.0:8089
tlscertfile=/etc/asterisk/keys/voz.crt
tlsprivatekey=/etc/asterisk/keys/voz.key
enablestatic=no
servername=
sessionlimit=200
session_inactivity=30000
session_keep_alive=15000
