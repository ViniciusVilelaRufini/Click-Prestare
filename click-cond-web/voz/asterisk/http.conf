; Prestare Voz — servidor HTTP do Asterisk: SÓ no loopback, sem TLS.
; Aqui ficam a ARI (usada pelo serviço Node) e o /ws do WebRTC. Para fora, quem
; escuta é o nginx (nginx/prestare-voz.conf): TLS na 8089 e repasse só de /ws.
; Assim a ARI nunca fica exposta na internet.
[general]
enabled=yes
bindaddr=127.0.0.1
bindport=8088
tlsenable=no
enable_status=no
enablestatic=no
servername=
sessionlimit=200
session_inactivity=30000
session_keep_alive=15000
