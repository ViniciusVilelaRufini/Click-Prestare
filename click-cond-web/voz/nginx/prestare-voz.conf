# Prestare Voz — nginx na frente do WebSocket SIP do Asterisk.
# TLS na 8089 com o certificado do Let's Encrypt (cópia do hook em
# /etc/prestare-voz/tls). Só /ws vai ao Asterisk (127.0.0.1:8088); a ARI e
# qualquer outro caminho respondem 404.
server {
    listen 8089 ssl;
    server_name voz.prestarecondominios.com.br;

    ssl_certificate /etc/prestare-voz/tls/fullchain.pem;
    ssl_certificate_key /etc/prestare-voz/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:prestare_voz:1m;

    server_tokens off;
    access_log /var/log/nginx/prestare-voz.access.log;
    error_log /var/log/nginx/prestare-voz.error.log warn;

    location = /ws {
        proxy_pass http://127.0.0.1:8088/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
